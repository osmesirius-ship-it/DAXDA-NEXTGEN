<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>DAXDA — Pepper's Ghost 3D Hologram</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #000000;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }

    #hud {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 16px;
      background: rgba(10, 14, 24, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      font-size: 12px;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 20;
      max-width: 94vw;
    }
    #hud.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(12px);
    }
    button {
      background: rgba(30, 41, 59, 0.85);
      color: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: rgba(51, 65, 85, 0.95); }
    button.active {
      background: rgba(245, 176, 65, 0.22);
      border-color: #f5b041;
      color: #fde68a;
    }
    label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #94a3b8;
    }
    input[type="range"] {
      width: 82px;
      accent-color: #f5b041;
    }
    #hint {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(148, 163, 184, 0.65);
      letter-spacing: 0.04em;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #hint.hidden { opacity: 0; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hint">PEPPER'S GHOST 4-WAY · Place clear pyramid over center + · Press H or double-click to hide controls</div>

  <div id="hud">
    <button id="btnGhost" class="active">4-Way Pyramid</button>
    <button id="btnSingle">Single 3D</button>
    <button id="btnState">Amber (Nicole)</button>
    <button id="btnMic">Mic Reactive: Off</button>
    <button id="btnComma">Comma 7.04°</button>
    <label>Size <input id="sizeSlider" type="range" min="55" max="150" value="100" /></label>
    <label>Spread <input id="spreadSlider" type="range" min="18" max="42" value="28" /></label>
    <label>Curvature K <input id="curvSlider" type="range" min="-100" max="100" value="-100" /></label>
    <button id="btnFull">Fullscreen (F)</button>
    <button id="btnHide">Hide HUD (H)</button>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');
    const hint = document.getElementById('hint');
    const btnGhost = document.getElementById('btnGhost');
    const btnSingle = document.getElementById('btnSingle');
    const btnState = document.getElementById('btnState');
    const btnMic = document.getElementById('btnMic');
    const btnComma = document.getElementById('btnComma');
    const btnFull = document.getElementById('btnFull');
    const btnHide = document.getElementById('btnHide');
    const sizeSlider = document.getElementById('sizeSlider');
    const spreadSlider = document.getElementById('spreadSlider');
    const curvSlider = document.getElementById('curvSlider');

    const PHI = (1 + Math.sqrt(5)) / 2;
    const INV_PHI = 1 / PHI;

    // Dodecahedron ({5,4} boundary core)
    const rawVerts = [];
    for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]) rawVerts.push([x, y, z]);
    for (const y of [-INV_PHI, INV_PHI]) for (const z of [-PHI, PHI]) rawVerts.push([0, y, z]);
    for (const x of [-INV_PHI, INV_PHI]) for (const y of [-PHI, PHI]) rawVerts.push([x, y, 0]);
    for (const x of [-PHI, PHI]) for (const z of [-INV_PHI, INV_PHI]) rawVerts.push([x, 0, z]);
    const dodecaVerts = rawVerts.map(([x, y, z]) => {
      const m = Math.hypot(x, y, z);
      return [x / m, y / m, z / m];
    });
    const dodecaEdges = [];
    for (let i = 0; i < dodecaVerts.length; i++) {
      for (let j = i + 1; j < dodecaVerts.length; j++) {
        const d = Math.hypot(
          dodecaVerts[i][0] - dodecaVerts[j][0],
          dodecaVerts[i][1] - dodecaVerts[j][1],
          dodecaVerts[i][2] - dodecaVerts[j][2]
        );
        if (d < 0.78) dodecaEdges.push([i, j]);
      }
    }

    // Icosahedron (Cl(7,0) Hodge Dual inner bulk)
    const icoRaw = [];
    for (const s1 of [-1, 1]) for (const s2 of [-1, 1]) {
      icoRaw.push([0, s1, s2 * PHI]);
      icoRaw.push([s1, s2 * PHI, 0]);
      icoRaw.push([s2 * PHI, 0, s1]);
    }
    const icoVerts = icoRaw.map(([x, y, z]) => {
      const m = Math.hypot(x, y, z);
      return [x / m, y / m, z / m];
    });
    const icoEdges = [];
    for (let i = 0; i < icoVerts.length; i++) {
      for (let j = i + 1; j < icoVerts.length; j++) {
        const d = Math.hypot(
          icoVerts[i][0] - icoVerts[j][0],
          icoVerts[i][1] - icoVerts[j][1],
          icoVerts[i][2] - icoVerts[j][2]
        );
        if (d < 1.12) icoEdges.push([i, j]);
      }
    }

    let ghostMode = true;
    const states = [
      { name: 'Amber (Nicole)', primary: '#f5b041', secondary: '#38bdf8', glow: 'rgba(245, 176, 65, 0.42)', pulseHz: 0.7 },
      { name: 'Crystalline (Cl 7,0)', primary: '#38bdf8', secondary: '#a78bfa', glow: 'rgba(56, 189, 248, 0.42)', pulseHz: 0.35 },
      { name: 'Mesh Heartbeat', primary: '#34d399', secondary: '#f5b041', glow: 'rgba(52, 211, 153, 0.42)', pulseHz: 1.35 }
    ];
    let stateIdx = 0;
    let rotX = 0.45, rotY = 0.7, velX = 0, velY = 0.007;
    let dragging = false, lastX = 0, lastY = 0;
    let commaFlash = 0;

    // Optional live microphone reactivity
    let micActive = false, analyser = null, micData = null, audioLevel = 0;
    btnMic.onclick = async () => {
      if (micActive) {
        micActive = false;
        analyser = null;
        btnMic.textContent = 'Mic Reactive: Off';
        btnMic.classList.remove('active');
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const AC = window.AudioContext || window.webkitAudioContext;
        const ac = new AC();
        const src = ac.createMediaStreamSource(stream);
        analyser = ac.createAnalyser();
        analyser.fftSize = 256;
        src.connect(analyser);
        micData = new Uint8Array(analyser.frequencyBinCount);
        micActive = true;
        btnMic.textContent = 'Mic Reactive: ON';
        btnMic.classList.add('active');
      } catch (err) {
        btnMic.textContent = 'Mic Blocked';
      }
    };

    btnGhost.onclick = () => {
      ghostMode = true;
      btnGhost.classList.add('active');
      btnSingle.classList.remove('active');
    };
    btnSingle.onclick = () => {
      ghostMode = false;
      btnSingle.classList.add('active');
      btnGhost.classList.remove('active');
    };
    btnState.onclick = () => {
      stateIdx = (stateIdx + 1) % states.length;
      btnState.textContent = states[stateIdx].name;
    };
    btnFull.onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    };
    function toggleHud() {
      hud.classList.toggle('hidden');
      hint.classList.toggle('hidden');
    }
    btnHide.onclick = toggleHud;
    canvas.addEventListener('dblclick', toggleHud);
    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'h') toggleHud();
      if (e.key.toLowerCase() === 'f') btnFull.click();
    });

    btnComma.onclick = () => {
      commaFlash = 1.0;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        const ac = new AC();
        const now = ac.currentTime;
        const base = 261.63;
        const comma = Math.pow(3, 12) / Math.pow(2, 19);
        [base, base * 1.5, base * comma].forEach((freq, idx) => {
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = idx === 2 ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.18);
          gain.gain.setValueAtTime(0.0001, now + idx * 0.18);
          gain.gain.exponentialRampToValueAtTime(0.09, now + idx * 0.18 + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.1);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start(now + idx * 0.18);
          osc.stop(now + 2.2);
        });
      } catch (e) {}
    };

    canvas.addEventListener('pointerdown', (e) => {
      dragging = true; lastX = e.clientX; lastY = e.clientY;
    });
    window.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      rotY += dx * 0.008; rotX += dy * 0.008;
      velY = dx * 0.002; velX = dy * 0.002;
      lastX = e.clientX; lastY = e.clientY;
    });
    window.addEventListener('pointerup', () => { dragging = false; });

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    function rotate3D([x, y, z], ax, ay) {
      const x1 = x * Math.cos(ay) + z * Math.sin(ay);
      const z1 = -x * Math.sin(ay) + z * Math.cos(ay);
      const y2 = y * Math.cos(ax) - z1 * Math.sin(ax);
      const z2 = y * Math.sin(ax) + z1 * Math.cos(ax);
      return [x1, y2, z2];
    }

    function project([x, y, z], cx, cy, scale) {
      const fov = 3.2;
      const p = fov / (fov + z);
      return [cx + x * scale * p, cy + y * scale * p, z, p];
    }

    function drawLantern(cx, cy, scale, t, angleOffset = 0) {
      const st = states[stateIdx];
      const warp = parseFloat(curvSlider.value) / 100;
      const breath = 1 + 0.045 * Math.sin(t * st.pulseHz * Math.PI * 2) + audioLevel * 0.28;
      const s = scale * breath;

      ctx.save();
      ctx.translate(cx, cy);
      if (angleOffset !== 0) ctx.rotate(angleOffset);
      ctx.translate(-cx, -cy);

      // Luminous core aura
      const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, s * 1.25);
      grad.addColorStop(0, st.glow);
      grad.addColorStop(0.55, 'rgba(56, 189, 248, 0.10)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, s * 1.25, 0, Math.PI * 2);
      ctx.fill();

      // Clifford Bivector Rotor Rings with 7.038° Comma holonomy gap
      const commaGap = (7.038 * Math.PI) / 180 + commaFlash * 0.28 + audioLevel * 0.2;
      const rings = [
        { r: 1.22, tx: 0.55, ty: t * 0.45, color: st.primary, lw: 1.6 },
        { r: 1.08, tx: -0.95, ty: -t * 0.62, color: st.secondary, lw: 1.3 },
        { r: 0.92, tx: 1.35, ty: t * 0.85, color: st.primary, lw: 1.0 }
      ];
      for (const rc of rings) {
        ctx.beginPath();
        const steps = 60;
        const maxTh = Math.PI * 2 - commaGap;
        for (let i = 0; i <= steps; i++) {
          const th = (i / steps) * maxTh;
          const pt = rotate3D([Math.cos(th) * rc.r, Math.sin(th) * rc.r, 0], rc.tx + rotX, rc.ty + rotY);
          const [px, py] = project(pt, cx, cy, s);
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.strokeStyle = rc.color;
        ctx.globalAlpha = 0.65;
        ctx.lineWidth = rc.lw;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      // Outer {5,4} Dodecahedral Lattice
      const projD = dodecaVerts.map(v => project(rotate3D(v, rotX, rotY), cx, cy, s * (0.86 + 0.06 * warp)));
      for (const [i, j] of dodecaEdges) {
        const a = projD[i], b = projD[j];
        ctx.beginPath();
        ctx.moveTo(a[0], a[1]);
        const mx = (a[0] + b[0]) * 0.5, my = (a[1] + b[1]) * 0.5;
        const pull = 1 + warp * 0.16;
        ctx.quadraticCurveTo(cx + (mx - cx) * pull, cy + (my - cy) * pull, b[0], b[1]);
        ctx.strokeStyle = st.primary;
        ctx.globalAlpha = Math.max(0.28, Math.min(0.98, 0.68 - (a[2] + b[2]) * 0.22));
        ctx.lineWidth = 1.9;
        ctx.stroke();
      }
      for (const p of projD) {
        ctx.beginPath();
        ctx.arc(p[0], p[1], Math.max(1.8, 3.0 * p[3]), 0, Math.PI * 2);
        ctx.fillStyle = st.primary;
        ctx.globalAlpha = Math.max(0.35, 0.85 - p[2] * 0.22);
        ctx.fill();
      }

      // Inner Cl(7,0) Hodge-Dual Icosahedron
      const projI = icoVerts.map(v => project(rotate3D(v, -rotX * 0.8 + t * 0.3, -rotY * 0.8 - t * 0.4), cx, cy, s * 0.5));
      for (const [i, j] of icoEdges) {
        const a = projI[i], b = projI[j];
        ctx.beginPath();
        ctx.moveTo(a[0], a[1]);
        ctx.lineTo(b[0], b[1]);
        ctx.strokeStyle = st.secondary;
        ctx.globalAlpha = 0.72;
        ctx.lineWidth = 1.3;
        ctx.stroke();
      }

      // Singularity core
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, 3.6 * breath, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.restore();
    }

    function loop(ts) {
      const t = ts * 0.001;
      const w = window.innerWidth, h = window.innerHeight;

      if (micActive && analyser && micData) {
        analyser.getByteFrequencyData(micData);
        let sum = 0;
        for (let i = 0; i < 40; i++) sum += micData[i];
        const raw = sum / (40 * 255);
        audioLevel = audioLevel * 0.8 + raw * 0.2;
      } else {
        audioLevel *= 0.9;
      }

      if (!dragging) {
        rotY += velY + audioLevel * 0.025;
        rotX += velX;
        velX *= 0.96;
        velY = velY * 0.97 + 0.0065 * 0.03;
      }
      if (commaFlash > 0) commaFlash = Math.max(0, commaFlash - 0.025);

      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, w, h);

      const minDim = Math.min(w, h);
      const sizeMult = parseFloat(sizeSlider.value) / 100;
      const spreadRatio = parseFloat(spreadSlider.value) / 100;

      if (ghostMode) {
        const cx = w / 2, cy = h / 2;
        const offset = minDim * spreadRatio;
        const sc = minDim * 0.13 * sizeMult;

        if (!hud.classList.contains('hidden')) {
          ctx.strokeStyle = 'rgba(255,255,255,0.18)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(cx - 12, cy); ctx.lineTo(cx + 12, cy);
          ctx.moveTo(cx, cy - 12); ctx.lineTo(cx, cy + 12);
          ctx.stroke();
        }

        drawLantern(cx, cy - offset, sc, t, 0);
        drawLantern(cx, cy + offset, sc, t, Math.PI);
        drawLantern(cx - offset, cy, sc, t, -Math.PI / 2);
        drawLantern(cx + offset, cy, sc, t, Math.PI / 2);
      } else {
        drawLantern(w / 2, h / 2, minDim * 0.30 * sizeMult, t, 0);
      }

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
